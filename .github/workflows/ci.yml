name: CI

on:
  workflow_call:

jobs:
  npm-packages-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v7
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .
  tests:
    if: ${{ success() }}
    needs: [npm-packages-check]
    timeout-minutes: 20
    name: "Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # mongodb démarre pendant l'install, le typecheck et le lint ; l'étape « wait for mongodb »
      # attend sa fin avant les tests.
      - name: start mongodb (background)
        run: nohup .github/scripts/ci-start-test-services.sh /tmp/services.exit > /tmp/services.log 2>&1 &

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            .yarn/install-state.gz
            .yarn/cache
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install

      - name: Make sure to use same dependencies version across all packages
        run: yarn dedupe --check

      - name: typecheck
        run: yarn typecheck

      - name: check
        run: yarn check:ci

      - name: wait for mongodb
        id: services
        run: |
          timeout 300 bash -c 'until [ -f /tmp/services.exit ]; do sleep 1; done' || { echo "::error::démarrage de mongodb non terminé après 300 s"; cat /tmp/services.log; exit 1; }
          cat /tmp/services.log
          exit "$(cat /tmp/services.exit)"

      # Un conteneur qui sort au démarrage repasse en « restarting » (restart: unless-stopped) :
      # `--wait` le rapporte « unhealthy » sans sa sortie, d'où l'état et les logs ici.
      - name: diagnostic mongodb
        if: failure() && steps.services.outcome == 'failure'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200 mongodb

      - name: test
        run: yarn test:ci --maxWorkers=3

      # Le build UI n'est sinon exercé qu'au déploiement (_build.yml, appelé par recette.yml et
      # _deploy.yml). Depuis Next 16 il tourne sous Turbopack, sans config webpack : les erreurs de
      # bundling et de prerender ne se voient pas au typecheck.
      - name: build ui
        run: yarn workspace ui build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_ENV: local
          NEXT_PUBLIC_VERSION: 0.0.0-ci
          NEXT_PUBLIC_PRODUCT_NAME: api-apprentissage
          NEXT_PUBLIC_PRODUCT_REPO: mission-apprentissage/api-apprentissage
