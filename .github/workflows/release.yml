on:
  release:
    types: [published]

jobs:
  tests:
    uses: "./.github/workflows/ci.yml"

  release:
    if: ${{ success() }}
    needs: ["tests"]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          token: ${{ secrets.NPM_TOKEN }}
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            .yarn/install-state.gz
            .yarn/cache
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install

      - name: Build & publish NPM release
        run: .bin/mna sdk:release "${{ github.event.release.tag_name }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify failure on Slack
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERT }}
          title: "La publication de la version ${{ github.event.release.tag_name }} a échoué"
          mention: "!channel"

      - name: Notify success on Slack
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: success
          webhook: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
          title: "Version ${{ github.event.release.tag_name }} a été publiée avec succès"
