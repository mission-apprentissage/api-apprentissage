name: Build Docker Images
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to build the image for
        type: string
        required: true
    secrets:
      SLACK_WEBHOOK_NOTIF:
        description: Slack webhook URL
        required: true
      OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey
        required: true

jobs:
  npm-packages-check:
    name: NPM dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v7
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependencies
        run: mna-npm-check/npm-check.sh -p .

  build:
    name: Build & push images
    if: ${{ success() }}
    needs: ["npm-packages-check"]
    concurrency:
      group: "build-${{ github.workflow }}-${{ github.ref }}"
    # packages: write pour pousser les images sur ghcr.io.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Initialize the GnuPG keyring
        run: |
          install -d -m 700 "${RUNNER_TEMP}/gnupg"
          echo "GNUPGHOME=${RUNNER_TEMP}/gnupg" >> "${GITHUB_ENV}"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          echo -n "$OPENPGP_KEY" | gpg --batch --import
        env:
          OPENPGP_KEY: ${{ secrets.OPENPGP_PRIVATE_SUBKEY }}

      - name: Setup SOPS
        uses: nhedger/setup-sops@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Set short git commit SHA
        run: |
          export COMMIT_ID=${{ github.sha }}
          echo "VERSION=${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Build & push images
        run: .bin/mna app:build "${{ env.VERSION }}" push "${{ inputs.environment }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_NOTIF }}

      - name: Create sentry release
        run: .bin/mna sentry:release "${{ env.VERSION }}"
