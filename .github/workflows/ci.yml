name: CI

on:
  workflow_call:

jobs:
  npm-packages-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v4
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .
  tests:
    if: ${{ success() }}
    needs: [npm-packages-check]
    timeout-minutes: 20
    name: "Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/install-state.gz
            .yarn/cache
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install

      - name: Make sure to use same dependencies version across all packages
        run: yarn dedupe --check

      - name: typecheck
        run: yarn typecheck

      - name: lint
        run: yarn lint

      - name: start mongodb service
        run: |
          docker compose up --build -d --wait mongodb
          yarn setup:mongodb

      - name: test
        run: yarn test:ci --maxWorkers=3

      - name: prettier
        run: yarn prettier:check

      # Le build UI n'est sinon exercé qu'au déploiement (_build.yml, appelé par recette.yml et
      # _deploy.yml). Depuis Next 16 il tourne sous Turbopack, sans config webpack : les erreurs de
      # bundling et de prerender ne se voient pas au typecheck.
      - name: build ui
        run: yarn workspace ui build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_ENV: local
          NEXT_PUBLIC_VERSION: 0.0.0-ci
          NEXT_PUBLIC_PRODUCT_NAME: api-apprentissage
          NEXT_PUBLIC_PRODUCT_REPO: mission-apprentissage/api-apprentissage
